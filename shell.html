<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; frame-src http://127.0.0.1:*; connect-src 'none'; object-src 'none'"><title>AI-Cartoon-Live</title><link rel="icon" href="assets/whale.ico"><link rel="stylesheet" href="shell.css"></head>
<body><aside><img class="mark" src="assets/whale.png" alt="鲸鱼娘"><h1>AI-Cartoon-Live</h1><p class="tag">本地数字伙伴</p><nav><button data-page="/local" class="selected">和她聊聊</button><button data-page="/local/settings#character">角色与声音</button><button data-page="/local/settings#live">直播工作台</button><button id="stage">打开直播画面 ↗</button><button id="connection">模型连接</button></nav><div class="bottom"><span id="light"></span><span id="status">正在启动…</span><button id="logs">服务日志</button><button id="license">开源与素材许可</button></div></aside>
<main><header><div><strong id="title">欢迎认识你的数字伙伴</strong><small>本机画面与配音 · DeepSeek Flash 对话</small></div><button id="restart">重启本机服务</button></header>
<section id="welcome"><div class="welcome-card"><div class="wave">你好呀。</div><h2>第一次见面，先连上对话模型</h2><p>鲸鱼娘、语音模型和声音库已安装在这台电脑。填写你的 DeepSeek API Key，即可开始聊天。</p><form id="key-form"><label for="key">DeepSeek API Key</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" required minlength="12" maxlength="512"><button id="save" type="submit">验证并开始</button></form><p id="key-message" role="status"></p><button id="get-key" class="text">在 DeepSeek 官网创建密钥 ↗</button><p class="muted">密钥由 Windows 加密保存在本机。验证会发送一条极短测试请求，对话费用由你的 DeepSeek 账户承担。</p><div class="license-note">鲸鱼娘素材仅供非商业使用，署名与完整许可可在左下角查看。</div></div></section>
<section id="loading" hidden><div class="welcome-card"><div class="spinner"></div><h2 id="loading-title">正在唤醒鲸鱼娘</h2><p id="loading-message">正在加载本机模型…</p><button id="retry">重新启动</button></div></section>
<iframe id="view" title="数字伙伴工作台" allow="autoplay" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads" hidden></iframe>
<footer>聊天与语音开箱即用；真实开播仍需填写自己的直播间资料，并使用 OBS 或直播伴侣。<button id="copy-stage">复制本机直播画面地址</button></footer></main><script src="shell.js"></script></body></html>
